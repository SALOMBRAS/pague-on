services:
  postgres:
    image: postgres:16-alpine
    container_name: pagueon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pagueon
      POSTGRES_USER: pagueon_user
      POSTGRES_PASSWORD: pagueon_local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pagueon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagueon_user -d pagueon"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  pagueon_postgres_data:
