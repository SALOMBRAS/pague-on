<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Acesse sua conta Pague-On.">
  <title>Acessar o Pague-On</title>
  <link rel="stylesheet" href="/auth-enhancements.css">
  <style>
    html,body{min-height:100%;margin:0;background:#0f172a}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}#auth-shell{position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#1e40af55,transparent 32%),radial-gradient(circle at 85% 95%,#05966938,transparent 30%),#0f172a;color:#fff}.auth-loading{color:#cbd5e1;font-size:14px} @media(max-width:420px){#auth-shell{padding:16px}}
  </style>
</head>
<body data-auth-page="true">
  <main id="auth-shell" aria-live="polite"><p class="auth-loading">Preparando seu acesso seguro…</p></main>
  <script src="/auth.js"></script>
</body>
</html>
