<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <title>Complete seu cadastro · Pague-On</title>
  <style>
    :root{color-scheme:dark;--bg:#0a0a0a;--surface:#171717;--line:#303030;--text:#f5f5f5;--muted:#aaa;--green:#a3e635;--danger:#fca5a5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif}main{width:min(100% - 32px,620px);margin:0 auto;padding:44px 0 64px}h1{margin:8px 0;font-size:clamp(28px,7vw,38px)}p{line-height:1.5;color:var(--muted)}.eyebrow{color:var(--green);font-weight:800;text-transform:uppercase;font-size:12px;letter-spacing:.09em}.card{margin-top:28px;padding:20px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}form{display:grid;gap:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:grid;gap:7px;color:var(--muted);font-size:13px;font-weight:700}input,select,textarea{width:100%;min-height:45px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#0f0f0f;color:var(--text);font:inherit}textarea{min-height:80px;resize:vertical}button{min-height:48px;border:0;border-radius:10px;background:var(--green);color:#182100;font:inherit;font-weight:900;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.message{min-height:24px;margin:0;color:var(--muted)}.message.error{color:var(--danger)}.hidden{display:none}@media(max-width:520px){.grid{grid-template-columns:1fr}main{padding-top:30px}}
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Pague-On</span>
    <h1>Complete seu cadastro</h1>
    <p id="intro">Estamos verificando seu convite.</p>
    <section class="card" id="formCard" hidden>
      <form id="registrationForm" novalidate>
        <div class="grid"><label>Nome completo<input name="name" autocomplete="name" minlength="2" required></label><label>Como prefere ser chamado<input name="nickname" autocomplete="nickname"></label></div>
        <div class="grid"><label>Telefone<input name="phone" autocomplete="tel" inputmode="tel"></label><label>WhatsApp<input name="whatsapp" autocomplete="tel" inputmode="tel"></label></div>
        <label>E-mail<input name="email" autocomplete="email" type="email"></label>
        <div class="grid"><label>CPF/CNPJ<input name="cpfCnpj" inputmode="numeric"></label><label>Data de nascimento/abertura<input name="birthOrIncorporationDate" type="date"></label></div>
        <label>Profissão ou atividade<input name="professionOrActivity" autocomplete="organization-title"></label>
        <div class="grid"><label>CEP<input name="zipCode" autocomplete="postal-code"></label><label>Estado (UF)<input name="state" autocomplete="address-level1" maxlength="2"></label></div>
        <label>Endereço<input name="address" autocomplete="street-address"></label>
        <div class="grid"><label>Cidade<input name="city" autocomplete="address-level2"></label><label>Bairro<input name="neighborhood" autocomplete="address-level3"></label></div>
        <p class="message" id="message" role="status" aria-live="polite"></p>
        <button type="submit">Enviar cadastro</button>
      </form>
    </section>
  </main>
  <script src="/customer-registration.js" defer></script>
</body>
</html>
