    function skeletonHome(){ return `<header class="dashboard-head"><div class="dash-greeting"><div class="skel" style="flex:0 0 43px;width:43px;height:43px;border-radius:12px"></div><div style="flex:1"><div class="skel" style="height:13px;width:56%;margin:2px 0 8px"></div><div class="skel" style="height:15px;width:40%"></div></div></div></header><section class="dash-hero skel" style="height:104px"></section><div style="display:flex;gap:10px;margin:16px 0"><div class="skel" style="flex:1;height:70px"></div><div class="skel" style="flex:1;height:70px"></div><div class="skel" style="flex:1;height:70px"></div></div><div class="skel" style="height:120px"></div><div class="skel" style="height:120px;margin-top:12px"></div><div class="skel" style="height:140px;margin-top:12px"></div>`; }

    const $ = (sel) => document.querySelector(sel);
    function showToast(message){ const toast=$('#toast'); toast.textContent=message; toast.classList.add('show'); clearTimeout(window.toastTimer); window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2300); }
    function persistLocal(changes=[]){ const snapshot={debts,products,purchases,profile,smartRules,assets:JSON.parse(localStorage.getItem('pagueon.assets.v1')||'[]')}; window.pagueOnOffline?.commit(snapshot,changes).catch(()=>showToast('Alteração salva nesta tela; tente novamente mais tarde.')); window.dispatchEvent(new CustomEvent('pagueon:data-change',{detail:{snapshot}})); }
    const apiCategory={Produto:'PRODUCT',Produtos:'PRODUCT',Serviço:'SERVICE',Serviços:'SERVICE',Empréstimo:'LOAN',Aluguel:'RENT',Assinatura:'SUBSCRIPTION',Transporte:'TRANSPORT',Utilidades:'UTILITIES',Outro:'OTHER'};
    const apiFrequency={Semanal:'WEEKLY',Quinzenal:'BIWEEKLY',Mensal:'MONTHLY',Bimestral:'BIMONTHLY',Trimestral:'QUARTERLY',Semestral:'SEMIANNUAL',Anual:'ANNUAL'};
    function remoteDebt(item){return {id:item.id,type:item.type,paymentType:item.paymentType,status:item.status,counterparty:item.counterparty,description:item.description,amount:Number(item.installmentAmount||item.totalAmount),total:Number(item.totalAmount),due:new Date(item.dueDate),phone:item.counterpartyPhone,category:item.category,installments:item.totalInstallments,paidInstallments:item.paidInstallments,frequency:item.frequency,product:item.product?.name,productId:item.productId,quantity:item.quantity,paidAt:item.paidAt?new Date(item.paidAt):null,createdAt:new Date(item.createdAt),remote:true};}
    function remoteProduct(item){return {id:item.id,name:item.name,emoji:item.image?'🖼️':'📦',category:item.category,cost:Number(item.costPrice),selling:Number(item.sellingPrice),stock:item.stockQuantity,alert:item.minStockAlert,description:item.description,remote:true};}
    function remotePurchase(item){return {id:item.id,productId:item.productId,quantity:item.quantity,unitCost:Number(item.unitCost),supplier:item.supplier,date:new Date(item.date),remote:true};}
    function debtPayload(item){const due=item.due||new Date();return {type:item.type,paymentType:item.paymentType,description:item.description,category:apiCategory[item.category]||item.category||'OTHER',counterparty:item.counterparty||'Lançamento avulso',counterpartyPhone:item.phone||null,totalAmount:Number(item.total),totalInstallments:item.paymentType==='INSTALLMENT'?Number(item.installments):null,frequency:item.paymentType==='RECURRING'?(apiFrequency[item.frequency]||item.frequency||'MONTHLY'):null,startDate:new Date(due).toISOString(),productId:item.productId||null,quantity:item.quantity?Number(item.quantity):null,currency:'BRL'};}
    async function hydrateRemote(){if(!window.pagueOnApi?.authenticated())return;dashboardStatus='loading';dashboardRemote=null;try{const [dashboard,remoteDebts,remoteProducts,remotePurchases,remoteProfile]=await Promise.all([window.pagueOnApi.get('/dashboard'),window.pagueOnApi.get('/debts'),window.pagueOnApi.get('/products'),window.pagueOnApi.get('/purchases'),window.pagueOnApi.get('/auth/me')]);debts.splice(0,debts.length,...remoteDebts.map(remoteDebt));products.splice(0,products.length,...remoteProducts.map(remoteProduct));purchases.splice(0,purchases.length,...remotePurchases.map(remotePurchase));Object.assign(profile,{...remoteProfile,plan:remoteProfile.plan||'Free',push:remoteProfile.notificationEnabled,sound:remoteProfile.notificationSound!=='SILENT'});dashboardRemote=dashboard;dashboardStatus='ready';persistLocal();render();window.dispatchEvent(new CustomEvent('pagueon:remote-hydrated',{detail:{dashboard}}));}catch(error){dashboardStatus='error';showToast('Modo offline — mostrando dados salvos.');render();}}
    function matchesLocalTrigger(debt,trigger){ if(!trigger.type){ const actual=String(debt[trigger.field]??'').toLocaleLowerCase('pt-BR'),target=String(trigger.value).toLocaleLowerCase('pt-BR'); return trigger.operator==='contains'?actual.includes(target):actual===target; } const meta=TRIGGER_META[trigger.type]; if(!meta)return false; const actual=String(debt[meta.field]??''); if(meta.operator==='gt')return Number(actual)>Number(trigger.value); if(meta.operator==='lt')return Number(actual)<Number(trigger.value); const a=actual.toLocaleLowerCase('pt-BR'),b=String(trigger.value).toLocaleLowerCase('pt-BR'); return meta.operator==='contains'?a.includes(b):meta.operator==='starts_with'?a.startsWith(b):a===b; }
    function applySmartRulesLocal(debt){ let value={...debt,tags:[...(debt.tags||[])]}; const applied=[]; [...smartRules].filter(rule=>rule.isActive).sort((a,b)=>a.order-b.order).forEach(rule=>{const hit=rule.logic==='ANY'?rule.triggers.some(trigger=>matchesLocalTrigger(value,trigger)):rule.triggers.every(trigger=>matchesLocalTrigger(value,trigger));if(!hit)return;rule.actions.forEach(action=>{if(action.type==='SET_CATEGORY')value.category=action.value;if(action.type==='SET_TYPE')value.type=action.value;if(action.type==='SET_PAYMENT_TYPE'){value.paymentType=action.value;if(action.value==='RECURRING')value.frequency='Mensal';}if(action.type==='ADD_TAG'&&!value.tags.includes(action.value))value.tags.push(action.value);});applied.push(rule.name);});return {debt:value,applied}; }
    function kind(debt){ return debt.paymentType === 'INSTALLMENT' ? `PARCELADA ${debt.paidInstallments||0}/${debt.installments}` : debt.paymentType === 'RECURRING' ? 'RECORRENTE' : 'ÚNICA'; }
    function filtered(){ return debts.filter(d=>{ if(state.tab==='receive' && d.type!=='RECEIVABLE') return false; if(state.tab==='pay' && d.type!=='PAYABLE') return false; if(state.tab==='history' && d.status!=='PAID') return false; if(state.tab==='all' && d.status==='PAID') return false; if(state.tab==='recurring') return d.paymentType==='RECURRING' && d.status!=='PAID'; if(state.chip==='today' && relative(d.due)!=='Vence hoje') return false; if(state.chip==='overdue' && d.status!=='OVERDUE') return false; if(state.chip==='installment' && d.paymentType!=='INSTALLMENT') return false; if(state.chip==='recurring' && d.paymentType!=='RECURRING') return false; if(state.chip==='single' && d.paymentType!=='SINGLE') return false; const q=state.query.toLowerCase(); return !q || `${d.counterparty} ${d.description} ${d.amount}`.toLowerCase().includes(q); }).sort((a,b)=> (a.status==='OVERDUE'?-1:0)-(b.status==='OVERDUE'?-1:0) || a.due-b.due); }
    function card(debt){ const receive=debt.type==='RECEIVABLE', overdue=debt.status==='OVERDUE', isToday=relative(debt.due)==='Vence hoje'; const status=overdue?'Atrasado':isToday?'Hoje':debt.status==='PAID'?'Quitada':'Em aberto'; return `<article class="debt-wrap" data-swipe="${debt.id}"><div class="swipe-actions"><button class="done" data-action="done" data-id="${debt.id}">✓<br>Pago</button><button class="edit" data-action="edit" data-id="${debt.id}">✎<br>Editar</button><button class="delete" data-action="delete" data-id="${debt.id}">⌫<br>Excluir</button></div><div class="debt ${receive?'':'payable'} ${isToday?'today':''}" data-detail="${debt.id}"><div class="debt-top"><div class="meta"><i class="dot ${receive?'':'payable'}"></i>${receive?'A RECEBER':'A PAGAR'} <span>│</span><span class="payment-type">${kind(debt)}</span></div><span class="badge ${overdue?'overdue':debt.status==='PAID'?'paid':'pending'}">${status}</span></div><div class="person">${debt.counterparty}</div><div class="description">“${debt.description}”</div><div class="amountline"><span>${format(debt.amount)}</span><span class="due">${relative(debt.due)}</span></div><div class="actions">${debt.paymentType==='INSTALLMENT'?`<button class="small-btn" data-detail="${debt.id}">▤ Ver parcelas</button>`:''}${receive?`<button class="small-btn collect" data-action="collect" data-id="${debt.id}">💬 Cobrar</button>`:''}<button class="small-btn pay ${receive?'':'out'}" data-action="done" data-id="${debt.id}">✓ ${receive?'Receber':'Pagar'}</button></div></div></article>`; }
    function normalView(){ const items=filtered(); const totalReceive=debts.filter(d=>d.type==='RECEIVABLE'&&d.status!=='PAID').reduce((s,d)=>s+d.amount,0); const totalPay=debts.filter(d=>d.type==='PAYABLE'&&d.status!=='PAID').reduce((s,d)=>s+d.amount,0); return `<div class="summary"><div class="stat"><span>Ainda falta receber</span><b class="green">${format(totalReceive)}</b></div><div class="stat"><span>Você ainda deve</span><b class="red">${format(totalPay)}</b></div></div><div class="section-head"><div><h2>${state.tab==='all'?'Contas em aberto':labels[state.tab]}</h2><p>${items.length} ${items.length===1?'conta encontrada':'contas encontradas'}</p></div>${state.tab==='all'?'<button class="link" data-add>＋ Adicionar</button>':''}</div>${items.length?`<div class="list">${items.map(card).join('')}</div>`:`<div class="empty"><div style="font-size:32px">🎉</div><strong>Nenhuma conta no momento</strong><span>Você está em dia com suas finanças!</span><br><button data-add>＋ Adicionar primeira conta</button></div>`}`; }
    function recurringView(){ const all=filtered(); const groups=[['PAYABLE','📤 A PAGAR'],['RECEIVABLE','📥 A RECEBER']]; return groups.map(([type,title])=>{const rows=all.filter(d=>d.type===type); const sum=rows.reduce((s,d)=>s+d.amount,0); return `<section><div class="section-head"><div><p class="fixed-head">${title}</p><h2>Fixo mensal: ${format(sum)}</h2></div></div>${rows.length?rows.map(d=>`<article class="recurring" data-detail="${d.id}"><div class="recurring-main"><div><div class="recurring-name">${d.description}</div><div class="recurring-copy">${format(d.amount)} / ${d.frequency?.toLowerCase()||'mês'}</div><div class="recurring-next">Próximo: ${date(d.due)}</div></div><span class="badge pending">${d.type==='PAYABLE'?'Pagar':'Receber'}</span></div><div class="recurring-actions"><button class="tiny ${d.type==='PAYABLE'?'out':'primary'}" data-action="done" data-id="${d.id}">✓ Marcar ${d.due.toLocaleDateString('pt-BR',{month:'long'})}</button><button class="tiny" data-action="edit" data-id="${d.id}">✎</button><button class="tiny" data-action="delete" data-id="${d.id}">⌫</button></div></article>`).join(''):'<div class="empty"><strong>Sem compromissos ativos</strong><span>Adicione uma recorrência para vê-la aqui.</span></div>'}</section>`;}).join('')+`<button class="big-btn secondary" data-add>＋ Adicionar recorrência</button>`; }
    function historyView(){ const items=filtered(); return `<div class="chips" style="margin:0 0 10px"><button class="chip active">Este mês</button><button class="chip">Todos os tipos</button><button class="chip">Parceladas</button></div><div class="section-head"><div><h2>Contas quitadas</h2><p>Seu histórico financeiro</p></div></div>${items.map(d=>`<article class="history" data-detail="${d.id}"><div class="meta"><span class="badge paid">✓ QUITADA</span><span>${kind(d)}</span></div><h2 style="margin-top:12px">${d.counterparty}</h2><p>“${d.description}”</p><p>Total: ${format(d.total)}${d.installments?` · ${d.installments}x ${format(d.amount)}`:''}</p><p class="paid-at">Quitada em: ${date(d.paidAt||d.due)}</p><button class="small-btn" data-detail="${d.id}">Ver detalhes pagos</button></article>`).join('')}`; }

    function filteredProducts(){ return products.filter(p=>{if(state.stockFilter==='available'&&p.stock<=0)return false;if(state.stockFilter==='low'&&p.stock>p.alert)return false;const q=state.stockQuery.toLowerCase();return !q||p.name.toLowerCase().includes(q);}).sort((a,b)=>state.stockFilter==='profit'?productMargin(b)-productMargin(a):state.stockFilter==='az'?a.name.localeCompare(b.name):0); }

    function stockAnalysisView(){ const totalValue=products.reduce((sum,p)=>sum+p.stock*p.cost,0); const average=products.reduce((sum,p)=>sum+productMargin(p),0)/products.length; const low=products.filter(p=>p.stock<=p.alert); const rank=[...products].sort((a,b)=>productMargin(b)-productMargin(a)); const max=Math.max(...rank.map(productMargin),1); return `<div class="section-head"><div><p class="fixed-head">📊 ANÁLISE DO ESTOQUE</p><h2>Visão do seu inventário</h2></div></div><div class="analysis-summary"><div class="analysis-card"><b>${products.length}</b><span>Produtos cadastrados</span></div><div class="analysis-card"><b>${format(totalValue)}</b><span>Valor em estoque</span></div><div class="analysis-card"><b>${average.toFixed(1)}%</b><span>Margem média</span></div></div><div class="bar-chart"><h2>Produtos mais lucrativos</h2>${rank.map(p=>`<div class="bar-row"><label>${p.name}</label><div class="bar-track"><div class="bar-fill" style="width:${(productMargin(p)/max)*100}%"></div></div><b>${productMargin(p).toFixed(0)}%</b></div>`).join('')}</div><div class="low-alert"><h3>🚨 ${low.length} produto${low.length!==1?'s':''} precisa${low.length!==1?'m':''} de atenção</h3><ul>${low.length?low.map(p=>`<li>${p.name} (${p.stock} unid, mín: ${p.alert})</li>`).join(''):'<li>Todos os produtos estão acima do estoque mínimo.</li>'}</ul></div><div class="bar-chart"><h2>${profitRemote&&Array.isArray(profitRemote.byProduct)&&profitRemote.byProduct.length?'Lucro estimado por produto':'Evolução de compras'}</h2><div class="purchase-line">${profitRemote&&Array.isArray(profitRemote.byProduct)&&profitRemote.byProduct.length?(()=>{const sorted=[...profitRemote.byProduct].sort((a,b)=>b.estimatedProfit-a.estimatedProfit);const max=Math.max(1,...sorted.map(p=>p.estimatedProfit));return sorted.map(p=>`<div class="month-bar" style="height:${Math.max(8,Math.round((p.estimatedProfit/max)*100))}%"><i>${p.productName}</i></div>`).join('');})():[36,65,46,78,53,88].map((height,i)=>`<div class="month-bar" style="height:${height}%"><i>${['Mar','Abr','Mai','Jun','Jul','Ago'][i]}</i></div>`).join('')}</div>${profitStatus==='error'?`<div class="error-state" style="padding:16px"><span>Não foi possível carregar dados reais do lucro.</span><button data-profit-retry>Tentar novamente</button></div>`:''}</div>`; }

    function renderStockDetail(){ const p=products.find(x=>x.id===state.stockDetail); if(!p){state.stockDetail=null;render();return;} const productPurchases=[...purchases].filter(x=>x.productId===p.id).sort((a,b)=>b.date-a.date); const linked=debts.filter(d=>d.product===p.name); const margin=productMargin(p); $('#stockDetail').innerHTML=`<header class="detail-top"><button class="back" data-stock-back>← Voltar</button><div><button class="muted-icon" data-stock-edit>✎</button><button class="muted-icon" data-stock-delete>⌫</button></div></header><div class="stock-photo">${p.emoji}</div><h1 class="stock-detail-title">${p.name}</h1><p class="stock-detail-category">Categoria: ${p.category||'Não informada'}</p><section class="stock-section"><h3>💰 PREÇOS E LUCRO</h3><div class="stock-info"><span>Custo de aquisição</span><b>${format(p.cost)}</b></div><div class="stock-info"><span>Preço de venda</span><b>${format(p.selling)}</b></div><div class="stock-info"><span>Margem de lucro</span><b class="green">${margin.toFixed(1)}% 🟢</b></div><div class="stock-info"><span>Lucro por unidade</span><b>${format(p.selling-p.cost)}</b></div></section><section class="stock-section"><h3>📦 ESTOQUE</h3><div class="stock-info"><span>Quantidade atual</span><b>${p.stock} unidades</b></div><div class="stock-info"><span>Estoque mínimo</span><b>${p.alert} unidades</b></div><div class="stock-info"><span>Status</span><b class="${p.stock<=p.alert?'red':'green'}">${p.stock<=p.alert?'⚠️ Estoque baixo':'✅ OK'}</b></div></section><section class="stock-section"><h3>📜 HISTÓRICO DE COMPRAS</h3>${productPurchases.length?productPurchases.map(item=>`<article class="stock-history"><b>${item.quantity} unidades · ${format(item.unitCost)}/uni</b><p>${item.supplier||'Fornecedor não informado'} · ${date(item.date)}</p></article>`).join(''):'<div class="quick-note">Nenhuma compra registrada para este produto.</div>'}</section><div class="detail-actions"><button class="big-btn secondary" data-stock-linked>💰 Ver dívidas v     function renderRulesPanel(){ if(ruleEditor){renderRuleEditor();return;} $('#rulesPanel').innerHTML=`<header class="panel-head"><button class="back" data-close-panel>← Voltar</button><h2>Regras automáticas</h2><button class="read-all" data-add-rule>＋ Nova</button></header><p class="eyebrow" style="margin:20px 0 4px">Suas regras são aplicadas ao criar uma nova conta.</p>${smartRules.length?smartRules.sort((a,b)=>a.order-b.order).map(rule=>`<article class="rule-card ${rule.isActive?'':'off'}"><h3>${rule.name}</h3><p class="rule-copy">QUANDO</p>${rule.triggers.map(trigger=>`<div class="rule-item">• ${ruleCondition(trigger)}</div>`).join('')}<p class="rule-copy">ENTÃO</p>${rule.actions.map(action=>`<div class="rule-item">• ${ruleActionLabel(action)}</div>`).join('')}<div class="rule-actions"><button data-rule-edit="${rule.id}">✎ Editar</button><button data-rule-toggle="${rule.id}">${rule.isActive?'Pausar':'Ativar'}</button><button class="primary" data-rule-test="${rule.id}">▶ Testar</button><button data-rule-delete="${rule.id}">Excluir</button></div></article>`).join(''):`<div class="empty"><strong>Nenhuma regra criada</strong><span>Adicione um modelo para começar.</span></div>`}<button class="big-btn secondary" data-rules-run>▶ Reprocessar contas existentes</button>`; $('#rulesPanel').classList.add('show'); document.querySelectorAll('[data-close-panel]').forEach(b=>b.onclick=closePanel); $('[data-add-rule]').onclick=()=>{ruleEditor={name:'',logic:'ANY',triggers:[{type:'DESCRIPTION_CONTAINS',value:''}],actions:[{type:'SET_CATEGORY',value:'OTHER'}]};renderRulesPanel();}; document.querySelectorAll('[data-rule-toggle]').forEach(b=>b.onclick=async()=>{const rule=smartRules.find(item=>item.id===b.dataset.ruleToggle);if(!rule)return;rule.isActive=!rule.isActive;try{if(rule.remote)await window.pagueOnApi.put(`/rules/${rule.id}`,rulePayload(rule));}catch(e){rule.isActive=!rule.isActive;showToast(e.message||'Não foi possível atualizar a regra.');}persistLocal();renderRulesPanel();}); document.querySelectorAll('[data-rule-edit]').forEach(b=>b.onclick=()=>{const rule=smartRules.find(item=>item.id===b.dataset.ruleEdit);if(!rule)return;ruleEditor=JSON.parse(JSON.stringify(rule));renderRulesPanel();}); document.querySelectorAll('[data-rule-delete]').forEach(b=>b.onclick=async()=>{const index=smartRules.findIndex(item=>item.id===b.dataset.ruleDelete);if(index<0||!confirm('Excluir esta regra?'))return;const rule=smartRules[index];try{if(rule.remote)await window.pagueOnApi.delete(`/rules/${rule.id}`);smartRules.splice(index,1);persistLocal();renderRulesPanel();}catch(e){showToast(e.message||'Não foi possível excluir a regra.');}}); document.querySelectorAll('[data-rule-test]').forEach(b=>b.onclick=async()=>{const rule=smartRules.find(item=>item.id===b.dataset.ruleTest);if(!rule)return;if(rule.remote){try{const target=debts.find(d=>d.remote&&d.id);if(!target){showToast('Nenhuma conta do servidor disponível para testar.');return;}const res=await window.pagueOnApi.post(`/rules/${rule.id}/test`,{debtId:target.id});showToast(res.wouldApply?`A regra “${rule.name}” se aplicaria a “${res.preview?.after?.description||target.description}”`:'Nenhuma conta atual corresponde à regra');}catch(e){showToast(e.message||'Não foi possível testar a regra.');}return;}const sample=debts.find(debt=>{const copy=smartRules.splice(smartRules.indexOf(rule),1)[0];smartRules.unshift(copy);const result=applySmartRulesLocal(debt);smartRules.splice(smartRules.indexOf(copy),1);smartRules.push(copy);return result.applied.includes(rule.name);});showToast(sample?`A regra funciona para “${sample.description}”`:'Nenhuma conta atual corresponde à regra');}); $('[data-rules-run]').onclick=()=>{if(!confirm('Aplicar regras às contas existentes?'))return;let changed=0;debts.forEach(debt=>{const result=applySmartRulesLocal(debt);if(result.applied.length){Object.assign(debt,result.debt);changed+=1;}});persistLocal(debts.map(debt=>({entity:'debts',action:'UPDATE',payload:debt})));renderRulesPanel();showToast(`${changed} conta(s) revisada(s) pelas regras`);}; }

    function debtForm(){ const f=formState, d=f.data; if(f.step===1) return `${formHeader('Nova Conta',1,3)}<div class="form-body"><div class="field"><label>Tipo da conta</label><div class="segmented"><button class="segment ${f.type==='RECEIVABLE'?'active':''}" data-debt-type="RECEIVABLE">📥 Quem te deve</button><button class="segment ${f.type==='PAYABLE'?'active':''}" data-debt-type="PAYABLE">📤 Quem você deve</button></div></div>${field('Descrição','debtDescription',{value:d.description||'',placeholder:'Ex: Venda de camisetas',hint:'Descreva em poucas palavras o que é esta conta.'})}<div class="field"><label for="debtCategory">Categoria</label><select id="debtCategory"><option value="Produto">Produto</option><option value="Serviço">Serviço</option><option value="Empréstimo">Empréstimo</option><option value="Aluguel">Aluguel</option><option value="Assinatura">Assinatura</option><option value="Outro">Outro</option></select></div>${field('Pessoa ou empresa','debtCounterparty',{value:d.counterparty||'',placeholder:'Nome de quem paga ou recebe'})}${field('Telefone para cobrança','debtPhone',{type:'tel',value:d.phone||'',placeholder:'(11) 99999-9999'})}</div><div class="form-footer"><button class="form-next" data-debt-next>Próximo  ▶</button></div>`; if(f.step===2){ const isInstallment=f.payment==='INSTALLMENT', isRecurring=f.payment==='RECURRING'; const amountLabel=isRecurring?'Valor por período':'Valor total'; return `${formHeader('Valor',2,3)}<div class="form-body"><div class="field"><label>Tipo de pagamento</label><div class="segmented"><button class="segment payment ${f.payment==='SINGLE'?'active':''}" data-payment="SINGLE">Única</button><button class="segment payment ${isInstallment?'active':''}" data-payment="INSTALLMENT">Parcelada</button><button class="segment payment ${isRecurring?'active':''}" data-payment="RECURRING">Recorrente</button></div></div>${moneyField(amountLabel,'debtAmount',d.amount||'')}${isInstallment?`${field('Número de parcelas','debtInstallments',{type:'number',value:d.installments||'',placeholder:'Ex: 6'})}<div class="calc" id="installmentCalc">Valor da parcela: R$ —</div>${field('Data da 1ª parcela','debtStart',{type:'date',value:d.start||isoToday()})}`:''}${f.payment==='SINGLE'?field('Data de vencimento','debtDue',{type:'date',value:d.due||isoToday()}):''}${isRecurring?`<div class="field"><label for="debtFrequency">Frequência</label><select id="debtFrequency"><option value="WEEKLY">Semanal</option><option value="BIWEEKLY">Quinzenal</option><option value="MONTHLY" selected>Mensal</option><option value="BIMONTHLY">Bimestral</option><option value="QUARTERLY">Trimestral</option><option value="SEMIANNUAL">Semestral</option><option value="ANNUAL">Anual</option></select></div>${field('Data do 1º vencimento','debtStart',{type:'date',value:d.start||isoToday()})}<div class="field"><label for="debtRepeat">Repetir</label><select id="debtRepeat"><option value="indefinite">Indefinido</option><option value="count">X vezes</option><option value="until">Até uma data</option></select></div><div id="repeatExtra"></div>`:''}</div><div class="form-footer"><button class="form-next" data-debt-next>Próximo  ▶</button></div>`; } return `${formHeader('Vincular',3,3)}<div class="form-body"><div class="field"><label>Isso está relacionado a um produto?</label><div class="radio-row"><button class="radio ${!f.linkProduct?'active':''}" data-link-product="no">◉ Não</button><button class="radio ${f.linkProduct?'active':''}" data-link-product="yes">◉ Sim</button></div></div>${f.linkProduct?`<div class="field"><label>Selecione o produto</label><div class="product-strip">${products.map(p=>`<button class="product-choice ${f.productId===p.id?'active':''}" data-product-choice="${p.id}"><i>${p.emoji}</i>${p.name}</button>`).join('')}</div></div>${field('Quantidade','debtQuantity',{type:'number',value:d.quantity||1,placeholder:'1'})}<button class="link" data-product-form>＋ Cadastrar novo produto</button>`:'<div class="quick-note">Você pode vincular um produto agora ou adicionar uma conta avulsa.</div>'}</div><div class="form-footer"><button class="form-next" data-save-debt>💾 Salvar conta</button></div>`; }
    function productForm(){ const d=formState.data; return `${formHeader('Novo Produto')}<div class="form-body"><label class="photo" id="photoArea"><span>📷</span>Toque para tirar<br>ou enviar<input id="productPhoto" type="file" accept="image/*" hidden></label>${field('Nome do produto','productName',{value:d.name||'',placeholder:'Ex: Camiseta Preta'})}${field('Categoria','productCategory',{value:d.category||'',placeholder:'Ex: Roupas'})}<div class="split">${moneyField('Preço de custo','productCost',d.cost||'')}${moneyField('Preço de venda','productSelling',d.selling||'')}</div><div class="calc" id="marginCalc">Margem de lucro: —</div><div class="split">${field('Quantidade em estoque','productStock',{type:'number',value:d.stock||0})}${field('Alerta de estoque baixo','productAlert',{type:'number',value:d.alert||5})}</div><div class="field"><label for="productDescription">Descrição (opcional)</label><textarea id="productDescription" placeholder="Detalhes do produto">${d.description||''}</textarea></div></div><div class="form-footer"><button class="form-next" data-save-product>💾 Cadastrar produto</button></div>`; }

    function reminderForm(){ return `${formHeader('Novo Lembrete')}<div class="form-body"><div class="field"><label for="reminderDebt">Vincular a uma conta existente?</label><select id="reminderDebt"><option value="">Lembrete avulso</option>${debts.filter(d=>d.status!=='PAID').map(d=>`<option value="${d.id}">${d.counterparty} — ${d.description}</option>`).join('')}</select></div><div class="field"><label>Tipo de lembrete</label><div class="segmented"><button class="segment ${formState.data.reminderType==='PUSH'?'active':''}" data-reminder-type="PUSH">🔔 Push</button><button class="segment ${formState.data.reminderType==='WHATSAPP'?'active':''}" data-reminder-type="WHATSAPP">💬 WhatsApp</button><button class="segment ${formState.data.reminderType==='SMS'?'active':''}" data-reminder-type="SMS">SMS</button></div></div><div class="field"><label for="reminderWhen">Quando lembrar?</label><select id="reminderWhen"><option value="0">Na data do vencimento</option><option value="1">1 dia antes</option><option value="3">3 dias antes</option><option value="custom">Personalizado</option></select></div><div id="customDays"></div><div class="field"><label for="reminderMessage">Mensagem (opcional)</label><textarea id="reminderMessage" placeholder="Se deixar em branco, será usada a mensagem padrão"></textarea></div></div><div class="form-footer"><button class="form-next" data-save-reminder>🔔 Agendar lembrete</button></div>`; }
    function quickCashForm(){ const incoming=formState.kind==='income'; return `${formHeader(incoming?'Registrar Entrada':'Registrar Saída')}<div class="form-body"><div class="quick-note">Esta ação cria uma conta única já marcada como ${incoming?'recebida':'paga'}.</div>${field('Descrição','quickDescription',{placeholder:incoming?'Ex: Venda à vista':'Ex: Material de limpeza'})}${moneyField(incoming?'Valor recebido':'Valor pago','quickAmount','')}${field('Data','quickDate',{type:'date',value:isoToday()})}</div><div class="form-footer"><button class="form-next" data-save-quick>✓ Registrar ${incoming?'entrada':'saída'}</button></div>`; }
    function bindForm(){ const get=(id)=>$(id)?.value||''; document.querySelectorAll('[data-form-back]').forEach(b=>b.onclick=()=>{ if(formState.kind==='debt'&&formState.step>1){readDebt();formState.step--;renderForm();}else closeForm(); }); document.querySelectorAll('[data-debt-type]').forEach(b=>b.onclick=()=>{formState.type=b.dataset.debtType;renderForm();}); document.querySelectorAll('[data-payment]').forEach(b=>b.onclick=()=>{readDebt();formState.payment=b.dataset.payment;renderForm();}); document.querySelectorAll('[data-debt-next]').forEach(b=>b.onclick=()=>{readDebt(); if(formState.step===1 && (!formState.data.description||!formState.data.counterparty)){showToast('Preencha descrição e pessoa/empresa');return;} if(formState.step===2&&!money(formState.data.amount)){showToast('Informe um valor válido');return;} formState.step++;renderForm();}); document.querySelectorAll('[data-link-product]').forEach(b=>b.onclick=()=>{formState.linkProduct=b.dataset.linkProduct==='yes';renderForm();}); document.querySelectorAll('[data-product-choice]').forEach(b=>b.onclick=()=>{formState.productId=b.dataset.productChoice;renderForm();}); document.querySelectorAll('[data-save-debt]').forEach(b=>b.onclick=saveDebt); document.querySelectorAll('[data-save-product]').forEach(b=>b.onclick=saveProduct); document.querySelectorAll('[data-save-purchase]').forEach(b=>b.onclick=savePurchase); document.querySelectorAll('[data-save-reminder]').forEach(b=>b.onclick=()=>{closeForm();showToast('Lembrete agendado com sucesso! 🔔');}); document.querySelectorAll('[data-save-quick]').forEach(b=>b.onclick=saveQuick); document.querySelectorAll('[data-reminder-type]').forEach(b=>b.onclick=()=>{formState.data.reminderType=b.dataset.reminderType;renderForm();}); document.querySelectorAll('[data-product-form]').forEach(b=>b.onclick=()=>{formState={kind:'product',step:1,type:'RECEIVABLE',payment:'SINGLE',data:{}};renderForm();}); $('#debtAmount')?.addEventListener('input',installmentPreview); $('#debtInstallments')?.addEventListener('input',installmentPreview); $('#debtRepeat')?.addEventListener('change',repeatExtra); $('#reminderWhen')?.addEventListener('change',customDays); $('#productCost')?.addEventListener('input',marginPreview); $('#productSelling')?.addEventListener('input',marginPreview); $('#purchaseQuantity')?.addEventListener('input',purchasePreview); $('#purchaseCost')?.addEventListener('input',purchasePreview); $('#productPhoto')?.addEventListener('change',previewPhoto); installmentPreview(); marginPreview(); purchasePreview(); }
    function readDebt(){ if(!formState||formState.kind!=='debt')return; const d=formState.data; const put=(key,id)=>{if($(id))d[key]=$(id).value;}; put('description','debtDescription');put('category','debtCategory');put('counterparty','debtCounterparty');put('phone','debtPhone');put('amount','debtAmount');put('currency','currency-debtAmount');put('installments','debtInstallments');put('due','debtDue');put('start','debtStart');put('frequency','debtFrequency');put('repeat','debtRepeat');put('quantity','debtQuantity'); }

    function previewPhoto(e){ const file=e.target.files?.[0];if(!file)return; const reader=new FileReader();reader.onload=()=>{$('#photoArea').innerHTML=`<img src="${reader.result}" alt="Prévia do produto"><button class="photo-remove" id="removePhoto">⌫</button><input id="productPhoto" type="file" accept="image/*" hidden>`;$('#removePhoto').onclick=()=>{formState.data.photo='';renderForm();};};reader.readAsDataURL(file); }
    async function saveDebt(){readDebt();const d=formState.data,total=money(d.amount),count=formState.payment==='INSTALLMENT'?Number(d.installments||0):null;if(formState.payment==='INSTALLMENT'&&count<2){showToast('Informe pelo menos 2 parcelas');return;}const product=products.find(p=>p.id===formState.productId);const raw=applySmartRulesLocal({id:`new-${Date.now()}`,type:formState.type,paymentType:formState.payment,status:'PENDING',counterparty:d.counterparty,description:d.description,amount:formState.payment==='INSTALLMENT'?total/count:total,total,due:new Date(d.due||d.start||isoToday()),phone:d.phone,category:d.category||'Outro',installments:count,paidInstallments:0,frequency:d.frequency||'Mensal',product:product?.name,productId:product?.remote?product.id:null,quantity:d.quantity||null,createdAt:new Date()});const persist=async()=>{try{if(window.pagueOnApi?.authenticated()){const saved=await window.pagueOnApi.post('/debts',debtPayload(raw.debt));debts.unshift(remoteDebt(saved));}else{debts.unshift(raw.debt);persistLocal([{entity:'debts',action:'CREATE',payload:debts[0]}]);}state.screen='caixa';state.tab='all';closeForm();render();showToast('Conta adicionada com sucesso.');}catch(error){showToast(error.message||'Não foi possível salvar a conta.');}};if(window.pagueOnDuplicate?.guard(raw.debt,persist))return;persist();}
    async function saveProduct(){const name=$('#productName').value.trim(),cost=money($('#productCost').value),selling=money($('#productSelling').value);if(!name||!selling){showToast('Informe nome e preço de venda');return;}const local={id:`product-${Date.now()}`,name,emoji:'📦',category:$('#productCategory').value.trim(),cost,selling,stock:Number($('#productStock').value||0),alert:Number($('#productAlert').value||5)};try{if(window.pagueOnApi?.authenticated()){const saved=await window.pagueOnApi.post('/products',{name,category:local.category||null,costPrice:cost,sellingPrice:selling,stockQuantity:local.stock,minStockAlert:local.alert,description:$('#productDescription')?.value||null});products.push(remoteProduct(saved));}else{products.push(local);persistLocal([{entity:'products',action:'CREATE',payload:local}]);}state.screen='stock';closeForm();render();showToast('Produto cadastrado com sucesso.');}catch(error){showToast(error.message||'Não foi possível cadastrar o produto.');}}
    async function savePurchase(){const product=products.find(p=>p.id===$('#purchaseProduct').value),quantity=Number($('#purchaseQuantity').value||0),unitCost=money($('#purchaseCost').value);if(!quantity||!unitCost||!product){showToast('Informe produto, quantidade e custo unitário');return;}try{if(window.pagueOnApi?.authenticated()&&product.remote){await window.pagueOnApi.post('/purchases',{productId:product.id,quantity,unitCost,supplier:$('#purchaseSupplier').value.trim()||null,date:new Date($('#purchaseDate').value).toISOString(),notes:$('#purchaseNotes')?.value||null});await hydrateRemote();}else{product.stock+=quantity;purchases.unshift({id:`purchase-${Date.now()}`,productId:product.id,quantity,unitCost,supplier:$('#purchaseSupplier').value.trim(),date:new Date($('#purchaseDate').value)});persistLocal([{entity:'purchases',action:'CREATE',payload:purchases[0]},{entity:'products',action:'UPDATE',payload:product}]);}state.screen='stock';state.stockTab='purchases';closeForm();render();showToast(`Compra registrada. Estoque de ${product.name} atualizado!`);}catch(error){showToast(error.message||'Não foi possível registrar a compra.');}}
    function saveQuick(){const amount=money($('#quickAmount').value),description=$('#quickDescription').value.trim();if(!amount||!description){showToast('Informe descrição e valor');return;}const income=formState.kind==='income';const raw=applySmartRulesLocal({id:`quick-${Date.now()}`,type:income?'RECEIVABLE':'PAYABLE',paymentType:'SINGLE',status:'PAID',counterparty:'Lançamento avulso',description,amount,total:amount,due:new Date($('#quickDate').value),paidAt:new Date(),category:'Outro',createdAt:new Date()});const result={...raw,debt:window.pagueOnCurrency?.toBrl(raw.debt,$('#currency-quickAmount')?.value||'BRL')||raw.debt};const persist=()=>{debts.unshift(result.debt);persistLocal([{entity:'debts',action:'CREATE',payload:debts[0]}]);state.tab='history';closeForm();showToast(result.applied.length?`${income?'Entrada':'Saída'} registrada. Regra aplicada: ${result.applied.join(', ')}`:`${income?'Entrada':'Saída'} registrada com sucesso!`);};if(window.pagueOnDuplicate?.guard(result.debt,persist))return;persist();}
    $('#searchBtn').onclick=()=>{ $('#searchWrap').classList.toggle('open'); if($('#searchWrap').classList.contains('open')) $('#searchInput').focus(); }; $('#searchInput').oninput=e=>{state.query=e.target.value;render();}; $('#addBtn').onclick=openSheet; $('#centerAdd').onclick=openSheet; $('#sheetBackdrop').onclick=closeSheet; $('#sheetCancel').onclick=closeSheet; document.querySelectorAll('[data-create]').forEach(b=>b.onclick=()=>openForm(b.dataset.create)); let dragStart=0; $('#sheetHandle').onpointerdown=e=>dragStart=e.clientY; $('#sheetHandle').onpointerup=e=>{if(e.clientY-dragStart>45)closeSheet();dragStart=0;}; document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{const nav=b.dataset.nav; if(['home','caixa','wealth','stock','profile','goals'].includes(nav)){state.screen=nav;state.detail=null;state.stockDetail=null;state.panel=null;render();}}); document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{state.screen='caixa';state.tab=b.dataset.go;state.chip='all';render();}); $('#homeSale')?.addEventListener('click',openSheet); $('#homeDebt')?.addEventListener('click',openSheet); $('#stockAdd').onclick=()=>openForm('product'); $('#stockSearch').onclick=()=>{const query=prompt('Buscar produto',state.stockQuery);if(query!==null){state.stockQuery=query;state.stockTab='products';render();}};
    $('#rulesQuick').onclick=()=>openPanel('rules');
    render();
    window.pagueOnOffline?.boot({ hydrate(snapshot){
      if(Array.isArray(snapshot.debts)) debts.splice(0,debts.length,...snapshot.debts);

      profile.pin = Boolean(detail.pinHash);

      profile.hideValues = Boolean(detail.hideValues);
      profile.lockTimeout = Number(detail.lockTimeout || 5);
      persistLocal();
      render();

    window.pagueOnExportData = {
      snapshot(){ return { version:'1.0', exportedAt:new Date().toISOString(), profile:{ name:profile.name, email:profile.email, currency:profile.currency, theme:profile.theme }, data:{ debts, products, purchases, rules:smartRules, assets:JSON.parse(localStorage.getItem('pagueon.assets.v1')||'[]'), budgets:JSON.parse(localStorage.getItem('pagueon.budgets.v1')||'[]') } }; },
      restore(backup){
        if(!backup || backup.version!=='1.0' || !backup.data || !Array.isArray(backup.data.debts) || !Array.isArray(backup.data.products) || !Array.isArray(backup.data.purchases)) throw new Error('Formato de backup inválido.');
        const revive=(items,fields)=>items.map(item=>{ const copy={...item}; fields.forEach(field=>{if(copy[field])copy[field]=new Date(copy[field]);}); return copy; });
        debts.splice(0,debts.length,...revive(backup.data.debts,['due','paidAt'])); products.splice(0,products.length,...backup.data.products); purchases.splice(0,purchases.length,...revive(backup.data.purchases,['date'])); if(Array.isArray(backup.data.rules)) smartRules.splice(0,smartRules.length,...backup.data.rules); if(Array.isArray(backup.data.assets))localStorage.setItem('pagueon.assets.v1',JSON.stringify(backup.data.assets)); if(Array.isArray(backup.data.budgets))localStorage.setItem('pagueon.budgets.v1',JSON.stringify(backup.data.budgets)); if(backup.profile) Object.assign(profile,backup.profile); persistLocal(); render();
      }
    };

    };
    /* ===== Atalhos de teclado (desktop) ===== */
    document.addEventListener('keydown', (e) => {
      const target = e.target;
      const tag = (target && (target.tagName || '').toUpperCase());
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (target && target.isContentEditable)) return;
      const key = e.key;
      if (key === 'n' || key === 'N') { e.preventDefault(); openForm('debt'); }
      else if (key === '/') { e.preventDefault(); openPanel('search'); }
      else if (key === 'Escape') {
        if (document.querySelector('#formView.show')) closeForm();
        else if (document.querySelector('#sheet.show')) closeSheet();
        else if (state.panel) closePanel();
        else if (state.detail || state.stockDetail) { state.detail = null; state.stockDetail = null; render(); }
      }
    });
  </script>
